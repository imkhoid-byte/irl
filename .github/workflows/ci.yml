name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, typecheck, tests, eval self-checks, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Unit tests, the MCP server over stdio, the agent loop against a stub API,
      # and the eval grader self-checks (reference 100%, null and eager fail).
      - run: npm test
      - name: Reference eval must score 100%
        run: npm run -s eval -- --agent reference --out /tmp/eval-reference | tee /tmp/eval.md && grep -q "= 100%" /tmp/eval.md
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
