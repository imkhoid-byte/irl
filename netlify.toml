# Deploys with Netlify's Next.js runtime. The plugin is declared explicitly so
# Netlify never falls back to publishing .next as static files (which 404s).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # node:sqlite (used by the demo database) needs Node 22.13+.
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
